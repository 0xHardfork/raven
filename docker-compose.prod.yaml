version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: raven-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-raven}
    volumes:
      - raven_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-raven}"]
      interval: 10s
      timeout: 5s
      retries: 5

  raven-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raven-watcher-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    command: ["watch", "--interval", "15m"]
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro

  raven-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raven-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    command: ["server", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro

volumes:
  raven_pgdata:
    driver: local
