# ==========================================
# Raven Configuration Template (config.example.yaml)
# 复制为 configs/config.yaml 并填入实际凭据使用
# ==========================================

# 1. PostgreSQL 数据库配置
database:
  host: "127.0.0.1"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "raven"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  auto_migrate: true       # 启动时是否自动执行 Flyway 式版本化表结构检查

# 2. Web API 服务配置
server:
  host: "0.0.0.0"
  port: 8080

# 3. 守护巡检模式配置 (raven watch)
watcher:
  interval: "15m"          # 轮询检测频率 (如 10m, 15m, 1h)
  categories: []           # 重点关注的技术栈分类 (留空则巡检所有)
  sources: []              # 指定巡检的源 (留空则全量执行 scripts/)

# 4. 告警推送配置
notifier:
  enabled: true
  dry_run: true            # 本地开发建议开启：不实际发送网络请求，在终端打印富文本卡片预览
  min_severity: "HIGH"     # 最低告警级别：CRITICAL | HIGH | MEDIUM | LOW
  only_with_poc: false     # 是否仅在有可用 PoC 时才推送
  always_notify_exploited: true # 命中 CISA KEV (在野利用) 无论等级无条件强制推送
  filter_categories:       # 关注的技术生态分类过滤 (留空为不过滤)
    - "java"
    - "golang"
    - "php"
  channels:
    slack:
      enabled: false       # 填入 Webhook 后设置为 true
      webhook_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
      channel: "#security-threats"
      bot_token: ""

# 5. Python 采集器子进程调度环境
python:
  binary_path: "python3"   # Python 解释器路径 (如特定虚拟环境 /path/to/venv/bin/python)
  scripts_dir: "scripts"   # 收集脚本存放目录
  timeout_sec: 60          # 单次脚本执行超时时间 (秒)
