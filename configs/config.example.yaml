# ==========================================
# Raven Configuration Template (config.example.yaml)
# Copy to configs/config.yaml and configure credentials
# ==========================================

# 1. PostgreSQL Database Configuration
database:
  host: "127.0.0.1"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "raven"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  auto_migrate: true

# 2. Web API Server Configuration
server:
  host: "0.0.0.0"
  port: 8080

# 3. Watcher Daemon Configuration (raven watch)
watcher:
  interval: "15m"
  categories: []
  sources: []

# 4. Notification Configuration
notifier:
  enabled: true
  dry_run: true
  min_severity: "HIGH"
  only_with_poc: false
  always_notify_exploited: true
  filter_categories:
    - "java"
    - "golang"
    - "php"
  channels:
    slack:
      enabled: false
      webhook_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
      channel: "#security-threats"
      bot_token: ""

# 5. Python Runner Configuration
python:
  binary_path: "python3"
  scripts_dir: "scripts"
  timeout_sec: 60
